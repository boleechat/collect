# 由 hysteria2:// 分享链接转换而来
# 原始链接:
# hysteria2://zW4iYb6fsQ3WJm1DDP%2FM0nNfajL6tbApGLgrC2dOXFo=@47.77.211.222:8443?peer=www.microsoft.com&insecure=1#US-aliyun
#
# 注意:
# - 密码中的 %2F 已解码为 /
# - peer 参数已映射为 Clash Meta / Mihomo 内核使用的 sni 字段
# - insecure=1 已映射为 skip-cert-verify: true

proxies:
  - name: US-aliyun
    type: hysteria2
    server: 47.77.211.222
    port: 8443
    password: "zW4iYb6fsQ3WJm1DDP/M0nNfajL6tbApGLgrC2dOXFo="
    sni: www.microsoft.com
    skip-cert-verify: true
    # 如果服务器开启了 QUIC 端口跳跃或多端口，可按需添加 ports 字段
    # up: "20 Mbps"     # 可选，上行带宽限制
    # down: "100 Mbps"  # 可选，下行带宽限制

# ---- 以下为策略组和规则，方便你直接用这份文件在 Clash Verge 里做连通性测试 ----
proxy-groups:
  - name: PROXY
    type: select
    proxies:
      - US-aliyun
      - DIRECT

rules:
  - MATCH,PROXY
